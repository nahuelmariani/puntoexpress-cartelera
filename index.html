<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Punto Express — Cartelera</title>
  <link rel="preload" href="fonts/PlayfairDisplay-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/Barlow-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="stage">
    <video id="bg-video" class="bg-video" muted loop playsinline autoplay preload="auto"></video>

    <main class="label">
      <header class="label-header">
        <img class="logo" src="media/logo.svg" alt="Punto Express">
      </header>
      <section class="pages">
        <div class="page"></div>
        <div class="page"></div>
      </section>
      <footer class="label-footer" id="footer-text"></footer>
    </main>

    <section id="institutional" class="institutional">
      <video id="inst-video" muted playsinline preload="auto"></video>
      <div class="inst-logo"><img src="media/logo.svg" alt=""></div>
    </section>

    <div id="debug" hidden></div>
  </div>

  <script src="vendor/papaparse.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
